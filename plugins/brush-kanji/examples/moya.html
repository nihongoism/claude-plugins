<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>靄 in Brush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500&family=Shippori+Mincho:wght@700&display=swap">
<style>
/* A single sheet of hanshi paper with the character brushed onto it, captions below.
   Colors and type follow the Nihongoism brand: brick #98342C accents, body text #441111,
   Alegreya headings, Inter body. Deliberately one look in both themes: ink on paper. */
:root{
  --desk:#e3cbbf; --paper:#fffaf3; --ink:#141414; --text:#441111; --muted:#7f6342; --guide:#e3cbbf;
  --brick:#98342c; --brick-dark:#7e2b24;
  --kanji:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --heading:"Alegreya",Georgia,serif;
  --body:"Inter",system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
body{margin:0;background:var(--desk);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--kanji);font-weight:700;font-size:26px;margin:0;color:var(--text)}
h1 small{font-family:var(--heading);font-style:italic;font-weight:600;font-size:17px;color:var(--brick);margin-left:10px}
.sheet{background:var(--paper);box-shadow:0 1px 2px rgba(68,17,17,.18),0 10px 30px rgba(68,17,17,.16);aspect-ratio:1;width:100%;max-width:100%;position:relative}
canvas{display:block;width:100%;height:100%}
.count{position:absolute;right:10px;bottom:8px;font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-family:var(--heading);font-weight:700;font-size:15px;padding:6px 16px;border:1.5px solid var(--brick);background:transparent;color:var(--brick);border-radius:8px;cursor:pointer}
button:hover{background:var(--brick);color:#fff}
button:focus-visible{outline:2px solid var(--brick-dark);outline-offset:2px}
label{font-size:14px;display:flex;gap:6px;align-items:center;cursor:pointer}
input[type=checkbox]{accent-color:var(--brick)}
ol,dl{margin:0}
ol{padding-left:20px;display:grid;gap:4px}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px}
dt{color:var(--muted)}
dd{margin:0}
.jp{font-family:var(--kanji)}
a{color:var(--brick)}
footer{display:grid;gap:10px;border-top:1px solid var(--guide);padding-top:14px}
.brand{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;text-decoration:none}
.brand svg{height:20px;width:auto;display:block}
.note{color:var(--muted);font-size:13px;margin:0;max-width:62ch}
</style>
</head>
